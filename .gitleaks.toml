# gitleaks runs in CI as a second opinion beside `npm run scan:secrets`, which enforces this
# project's own patterns. Every default gitleaks rule is kept.
#
# The two allowlists below are exact literals, never paths. A path allowlist would silence every
# future finding in that file, which is how a scanner stops being a scanner.
#
# The first is from the integration guide. gitleaks' generic-api-key rule fires on anything shaped
# `Key: <high-entropy value>`, and an `Idempotency-Key` header value is a string the merchant
# invents for one request: it authenticates nothing, grants nothing, and is meaningless to anyone
# who does not already hold the API key.
#
# The second is a `webhook_secrets` row identifier in a test, which a since-corrected variable name
# announced as a secret. The name is fixed in the tree; the commit that introduced it is not, and
# history is scanned deliberately.
#
# The rest are the chain codes and private keys of both ed25519 test vectors published in SLIP-0010.
# They are private keys in every sense a scanner can see, and that is the point: the specification
# publishes them so an implementation can prove it derives the same values, and this one asserts all
# of them. Listed by value rather than by path so that a real key pasted into the same file is still
# caught.

title = "CryptoPay"

[extend]
useDefault = true

[allowlist]
description = "Literals that are identifiers or examples, not credentials"
regexes = [
  '''Idempotency-Key: order-10422-attempt-1''',
