# The local environment: `docker compose up` reaches a working demo with nothing else to do.
#
# The layout is the deployment topology rather than a convenience. Three processes, three database
# roles, and two networks, because the containment those give is the whole point: the callback
# worker is the only thing here that makes outbound requests to addresses a stranger chose, and it
# is arranged so that compromising it reaches as little as possible.
#
# NODE_ENV defaults to development, and that is deliberate rather than an oversight. This stack talks
# to a demo receiver on a private address, and the API refuses to start with NODE_ENV=production
# while any private destination is allowlisted — a control that caught this exact misconfiguration
# while the file was being written. A real deployment sets CRYPTOPAY_NODE_ENV=production and must
# then leave CALLBACK_PRIVATE_DESTINATION_ALLOWLIST empty, which is the point of the pair.

name: cryptopay

services:
  postgres:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_USER: cryptopay
      POSTGRES_PASSWORD: cryptopay_local
      POSTGRES_DB: cryptopay
    volumes:
      # /var/lib/postgresql, not /var/lib/postgresql/data. PostgreSQL 18's image changed the layout
      # so that the data lives in a version-named subdirectory, which is what lets `pg_upgrade
      # --link` work later without crossing a mount boundary. Mounting the old path leaves the image
      # reporting data in an "unused mount/volume" and refusing to become healthy.
      - postgres-data:/var/lib/postgresql
    # Loopback only, and on a non-default port so it cannot collide with a PostgreSQL already
    # installed on the machine. Bound so an operator can run migrations, take a backup, or drive a
    # validation script against the real database; nothing outside this host can reach it.
    ports:
      - '127.0.0.1:5433:5432'
    networks: [internal]
    healthcheck:
      # pg_isready over TCP, never a sleep. A fixed wait is either too short on a slow machine or
      # wasted time on a fast one, and it fails intermittently in the way hardest to diagnose.
      #
      # The -h is load-bearing. Without it pg_isready uses the unix socket, which the entrypoint's
      # temporary init server also listens on: the check passes while the roles are still being
      # created, the real server has not started, and the migration then fails with "the database
      # system is starting up".
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U cryptopay -d cryptopay']
      interval: 2s
      timeout: 3s
      retries: 40
      start_period: 10s
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ['node', 'apps/api/dist/infrastructure/persistence/migrate-cli.js']
    environment:
      DATABASE_URL: postgresql://cryptopay:cryptopay_local@postgres:5432/cryptopay
      NODE_ENV: production
      API_KEY_PEPPER: ${API_KEY_PEPPER:?set API_KEY_PEPPER in .env before starting}
      WALLET_KEY_ENCRYPTION_KEY: ${WALLET_KEY_ENCRYPTION_KEY:?set WALLET_KEY_ENCRYPTION_KEY in .env}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    restart: 'no'

  # Makes an empty database usable: a wallet seed, one merchant, an API key, and a cursor for every
  # network that has an endpoint. Without these a freshly migrated database answers 401 to everything
  # and refuses every payment, and the first thing a new person meets is a confusing error.
  #
  # Idempotent, because Compose runs it on every start. The key it prints appears once, in this
  # service's logs: `docker compose logs bootstrap`.
  # Roles are applied after the migrations, because every grant here names a table the migrations
  # create. Running them as a database init hook fails on the first start with "relation does not
  # exist", which the image reports as a warning and then carries on from, leaving a deployment with
  # no roles that looks fine until something tries to connect.
  roles:
    image: postgres:18.4-bookworm
    command:
      - psql
      - postgresql://cryptopay:cryptopay_local@postgres:5432/cryptopay
      - -v
      - ON_ERROR_STOP=1
      - -f
      - /roles.sql
    volumes:
      - ./docker/roles.sql:/roles.sql:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [internal]
    restart: 'no'

  bootstrap:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command:
      - /bin/sh
      - -c
      - >-
        node apps/api/dist/infrastructure/wallet/provision-seed-cli.js test || true;
        node apps/api/dist/infrastructure/persistence/bootstrap-cli.js test
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://cryptopay:cryptopay_local@postgres:5432/cryptopay
      API_KEY_PEPPER: ${API_KEY_PEPPER:?}
      WALLET_KEY_ENCRYPTION_KEY: ${WALLET_KEY_ENCRYPTION_KEY:?}
      POLYGON_AMOY_RPC_URLS: ${POLYGON_AMOY_RPC_URLS:-}
      POLYGON_MAINNET_RPC_URLS: ${POLYGON_MAINNET_RPC_URLS:-}
      # Where the merchant's own signing secret is left for the bundled receiver to read. Generated
      # on first start rather than defaulted: a signing secret with a value written in a repository
      # is a signing secret everyone has.
      BOOTSTRAP_WEBHOOK_SECRET_PATH: /demo-secret/webhook-signing-secrets
    volumes:
      - demo-webhook-secret:/demo-secret
    depends_on:
      roles:
        condition: service_completed_successfully
    networks: [internal]
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ['node', 'apps/api/dist/main.api.js']
    environment:
      NODE_ENV: ${CRYPTOPAY_NODE_ENV:-development}
      HOST: 0.0.0.0
      PORT: 3001
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://cryptopay_api:cryptopay_api_local@postgres:5432/cryptopay
      API_KEY_PEPPER: ${API_KEY_PEPPER:?}
      WALLET_KEY_ENCRYPTION_KEY: ${WALLET_KEY_ENCRYPTION_KEY:?}
      PUBLIC_CHECKOUT_BASE_URL: ${PUBLIC_CHECKOUT_BASE_URL:-http://localhost:3000/pay}
      # The address the generated OpenAPI document advertises, so a client generated from
      # /openapi.json points at something reachable rather than at the container's own port.
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:3001}
      POLYGON_AMOY_RPC_URLS: ${POLYGON_AMOY_RPC_URLS:-}
      POLYGON_MAINNET_RPC_URLS: ${POLYGON_MAINNET_RPC_URLS:-}
      # Keyless endpoints only. This one is published by GET /v1/networks, unlike the scanning URLs
      # above, which may carry a provider key in the path.
      POLYGON_AMOY_WALLET_RPC_URL: ${POLYGON_AMOY_WALLET_RPC_URL:-}
      POLYGON_MAINNET_WALLET_RPC_URL: ${POLYGON_MAINNET_WALLET_RPC_URL:-}
      # The API applies the destination policy when a payment is created, so it must be configured
      # identically to the worker that applies it before every delivery. Two different values here
      # means a callback the API accepted is one the worker will refuse, which is the most confusing
      # shape this failure can take.
      CALLBACK_PRIVATE_DESTINATION_ALLOWLIST: ${CALLBACK_PRIVATE_DESTINATION_ALLOWLIST:-demo-receiver:8080}
      # Read only by the API, to report the ceiling the settlement worker enforces. The API cannot
      # sign and holds no key material; it says what the limit is, it does not apply it.
      SETTLEMENT_ENABLED: ${SETTLEMENT_ENABLED:-false}
      POLYGON_MAINNET_SPEND_CEILING: ${POLYGON_MAINNET_SPEND_CEILING:-}
      POLYGON_AMOY_SPEND_CEILING: ${POLYGON_AMOY_SPEND_CEILING:-}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    ports:
      - '3001:3001'
    networks: [internal]
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  chain-worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ['node', 'apps/api/dist/main.chain-worker.js']
    environment:
      NODE_ENV: ${CRYPTOPAY_NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://cryptopay_chain_worker:cryptopay_chain_local@postgres:5432/cryptopay
      API_KEY_PEPPER: ${API_KEY_PEPPER:?}
      WALLET_KEY_ENCRYPTION_KEY: ${WALLET_KEY_ENCRYPTION_KEY:?}
      POLYGON_AMOY_RPC_URLS: ${POLYGON_AMOY_RPC_URLS:-}
      POLYGON_MAINNET_RPC_URLS: ${POLYGON_MAINNET_RPC_URLS:-}
      SCANNER_POLL_INTERVAL_MILLISECONDS: ${SCANNER_POLL_INTERVAL_MILLISECONDS:-4000}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    # Separate from the API so that an HTTP flood cannot starve detection, and so detection keeps
    # running while the API is being redeployed. A customer whose money has already left their wallet
    # cannot be told to come back later.
    networks: [internal]
    restart: unless-stopped

  callback-worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ['node', 'apps/api/dist/main.callback-worker.js']
    environment:
      NODE_ENV: ${CRYPTOPAY_NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://cryptopay_callback_worker:cryptopay_callback_local@postgres:5432/cryptopay
      API_KEY_PEPPER: ${API_KEY_PEPPER:?}
      WALLET_KEY_ENCRYPTION_KEY: ${WALLET_KEY_ENCRYPTION_KEY:?}
      # The bundled receiver, reachable only because it is named here explicitly. There is no boolean
      # that opens private addresses generally, and the API refuses to start with this list set while
      # NODE_ENV is production.
      CALLBACK_PRIVATE_DESTINATION_ALLOWLIST: ${CALLBACK_PRIVATE_DESTINATION_ALLOWLIST:-demo-receiver:8080}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    # The only service reachable from the network the demo receiver sits on. It is also the only one
    # that connects to addresses a stranger chose, which is why it holds the narrowest database role
    # of the three: compromising it yields the outbox and the signing secrets, and refuses on
    # payments, api_keys and wallet_seeds.
    networks: [internal, outbound]
    restart: unless-stopped

  # The only process that can sign. It runs with the narrowest database role in the deployment and is
  # reachable from nothing: no port, no ingress, and the internal network only because it needs the
  # database and an RPC endpoint.
  #
  # Disabled by default. SETTLEMENT_ENABLED is a separate switch from having RPC endpoints on purpose:
  # a deployment that watches and notifies is useful on its own, and one that can also move money is a
  # different risk profile that somebody should have decided to accept.
  settlement-worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ['node', 'apps/api/dist/main.settlement-worker.js']
    environment:
      NODE_ENV: ${CRYPTOPAY_NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://cryptopay_settlement_worker:cryptopay_settlement_local@postgres:5432/cryptopay
      API_KEY_PEPPER: ${API_KEY_PEPPER:?}
      WALLET_KEY_ENCRYPTION_KEY: ${WALLET_KEY_ENCRYPTION_KEY:?}
      POLYGON_AMOY_RPC_URLS: ${POLYGON_AMOY_RPC_URLS:-}
      POLYGON_MAINNET_RPC_URLS: ${POLYGON_MAINNET_RPC_URLS:-}
      SETTLEMENT_ENABLED: ${SETTLEMENT_ENABLED:-false}
      # The blast radius, in whole POL. Nothing else in this system bounds losses by amount, and the
      # API refuses to start a production signer without one.
      POLYGON_MAINNET_SPEND_CEILING: ${POLYGON_MAINNET_SPEND_CEILING:-}
      POLYGON_AMOY_SPEND_CEILING: ${POLYGON_AMOY_SPEND_CEILING:-}
      SETTLEMENT_POLL_INTERVAL_MILLISECONDS: ${SETTLEMENT_POLL_INTERVAL_MILLISECONDS:-15000}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    networks: [internal]
    restart: unless-stopped
    profiles: [settlement]

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      NODE_ENV: production
      CRYPTOPAY_API_URL: http://api:3001
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '3000:3000'
    networks: [internal]
    restart: unless-stopped

  # A merchant endpoint that verifies signatures with the same module the API signs with, so the
  # demo proves interoperability rather than asserting it.
  demo-receiver:
    build:
      context: .
      dockerfile: docker/receiver.Dockerfile
    environment:
      NODE_ENV: production
      PORT: 8080
      # Read at start, from a volume the bootstrap wrote and this container cannot write to. With no
      # secret the receiver answers 503 to every callback rather than accepting one it cannot verify.
      WEBHOOK_SIGNING_SECRETS_FILE: /demo-secret/webhook-signing-secrets
    volumes:
      - demo-webhook-secret:/demo-secret:ro
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    networks: [outbound]
    restart: unless-stopped

networks:
  # Both are ordinary bridge networks, so both have internet egress: the chain worker needs it to
  # reach an RPC endpoint, and marking this one `internal: true` would stop detection entirely.
  #
  # The separation here is therefore about reachability between services, not about egress. The demo
  # receiver cannot see the database or the API; only the callback worker can see the receiver. The
  # control that actually limits where the callback worker connects is the destination policy in the
  # application, and the control that limits what a compromise reaches is the database role.
  internal:
    driver: bridge
  outbound:
    driver: bridge

volumes:
  postgres-data:
  demo-webhook-secret:
