name: CI

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned to commit SHAs rather than tags: a tag can be moved to point at different code,
# and a workflow with write access to a repository is worth attacking. The trailing comment records
# which release each SHA is, so upgrades stay reviewable.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Runs before anything else: a leaked credential is the one mistake a revert cannot undo.
      - run: npm run scan:secrets
      # The documentation generator reads the compiled transition table, so the build comes first.
      - run: npm run build
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run knip
      - run: npm run docs:check

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The shared package is consumed from its build output, so it has to exist first.
      - run: npm run build --workspace packages/shared
      # A separate job because this is the only check that catches a class purged by Tailwind. The
      # development server compiles on demand and looks correct; the failure appears only in a
      # production build, which makes it exactly the kind of thing CI has to run.
      - run: npm run build --workspace apps/web

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks inspects history, not just the checked-out tree, so a secret committed and
          # later removed is still found.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@44c470ffc35caa8b1eb3e8012ca53c2f9bea4eb5 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          # Pinned rather than 'stable': someone else's release must not be able to break this
          # pipeline on a morning nobody changed anything.
          version: v1.8.1
      - run: npm ci
      - run: npm run build
      # PostgreSQL and Anvil are both started by the suite itself as native binaries, so there is no
      # service container to wait on and the same command runs identically on a developer machine.
      # Coverage is measured here rather than in the unit job because only this one can run every
      # suite, and a coverage number that silently excludes the integration tests is a lie.
      - run: npm run test:coverage
      - name: Upload coverage report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # The fast suites only: no database, no chain, so this is the job that fails first and
      # fastest when something ordinary is broken.
      - run: npm test
